<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dirty Tag - Find it. Love it. Get it Dirty Again.">
  <title>Dirty Tag | Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Loading State -->
    <div id="loading" class="loading-state" aria-live="polite">
      <div class="skeleton skeleton-avatar"></div>
      <div class="skeleton skeleton-text skeleton-title"></div>
      <div class="skeleton skeleton-text skeleton-bio"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>

    <!-- Main Content -->
    <main id="content" class="content hidden" role="main">
      <!-- Profile Header -->
      <header class="profile-header">
        <img 
          id="avatar" 
          class="avatar" 
          src="" 
          alt="Dirty Tag profile picture"
          loading="lazy"
        >
        <h1 id="profile-name" class="profile-name"></h1>
        <p id="profile-bio" class="profile-bio"></p>
      </header>

      <!-- Category Filter -->
      <nav id="category-filter" class="category-filter" role="navigation" aria-label="Filtra per categoria">
      </nav>

      <!-- Links Section -->
      <section id="links-container" class="links-container" aria-label="Link utili">
      </section>

      <!-- Empty State -->
      <div id="empty-state" class="empty-state hidden">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
        <p>Nessun link disponibile</p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <button 
        id="theme-toggle" 
        class="theme-toggle" 
        aria-label="Cambia tema"
        type="button"
      >
        <svg id="icon-sun" class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        <svg id="icon-moon" class="theme-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <span class="footer-text">© 2025 Dirty Tag</span>
    </footer>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden" role="alert" aria-live="assertive">
      <span id="toast-message"></span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
